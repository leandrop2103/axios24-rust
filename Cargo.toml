[package]
name = "axios24"
version = "0.4.2"
edition = "2021"
description = "Duonn Axios 24 Digital Mixer Control Software (Modernized DS Mixer UI in Rust)"
build = "build.rs"

[dependencies]
eframe = { version = "0.31", default-features = false, features = ["glow", "persistence"] }
egui = { version = "0.31", default-features = false }
serde = { version = "1.0", features = ["derive"] }
serialport = { version = "4.7", default-features = false }
rfd = "0.15"
png = "0.18"

[build-dependencies]
winresource = "0.1"

[target.'cfg(target_os = "linux")'.dependencies]
cpal = "0.15"
midir = "0.10"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
