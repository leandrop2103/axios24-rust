name: Build & Release (Windows + Linux + Android)

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test
      - run: cargo build --release
      - run: Copy-Item target\release\axios24.exe axios24_rust.exe
      - uses: actions/upload-artifact@v4
        with:
          name: axios24-windows-x86_64
          path: axios24_rust.exe

  build-linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Linux audio, MIDI, GUI & serial dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libudev-dev libgtk-3-dev \
            libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libxkbcommon-dev libssl-dev libgl1-mesa-dev libasound2-dev
      - run: cargo test
      - run: cargo build --release
      - run: cp target/release/axios24 axios24_linux_x86_64
      - uses: actions/upload-artifact@v4
        with:
          name: axios24-linux-x86_64
          path: axios24_linux_x86_64

  build-android:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Test & Build Android APK (Kotlin + Jetpack Compose)
        working-directory: android
        run: |
          gradle test assembleRelease --no-daemon
          cp app/build/outputs/apk/release/app-release.apk ../axios24_android.apk
      - uses: actions/upload-artifact@v4
        with:
          name: axios24-android-apk
          path: axios24_android.apk

  publish-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [ build-windows, build-linux, build-android ]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Upload Windows, Linux & Android binaries to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          prerelease: ${{ contains(github.ref_name, 'alpha') || contains(github.ref_name, 'beta') }}
          files: |
            artifacts/axios24-windows-x86_64/axios24_rust.exe
            artifacts/axios24-linux-x86_64/axios24_linux_x86_64
            artifacts/axios24-android-apk/axios24_android.apk
