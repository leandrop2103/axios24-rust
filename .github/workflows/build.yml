name: Build & Release (Windows + Linux)

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test
      - run: cargo build --release
      - run: Copy-Item target\release\axios24.exe axios24_rust.exe
      - uses: actions/upload-artifact@v4
        with:
          name: axios24-windows-x86_64
          path: axios24_rust.exe

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Linux audio, MIDI, GUI & serial dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libudev-dev libgtk-3-dev \
            libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libxkbcommon-dev libssl-dev libgl1-mesa-dev libasound2-dev
      - run: cargo test
      - run: cargo build --release
      - run: cp target/release/axios24 axios24_linux_x86_64
      - uses: actions/upload-artifact@v4
        with:
          name: axios24-linux-x86_64
          path: axios24_linux_x86_64

  publish-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [ build-windows, build-linux ]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Upload Windows & Linux binaries to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          prerelease: ${{ contains(github.ref_name, 'alpha') || contains(github.ref_name, 'beta') }}
          files: |
            artifacts/axios24-windows-x86_64/axios24_rust.exe
            artifacts/axios24-linux-x86_64/axios24_linux_x86_64
